<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#007AFF"/>
  <g transform="translate(64,64)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="5"/>
    <!-- Progress arc (approx 270 degrees — 75% attendance) -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="170 226" transform="rotate(-90)"/>
    <!-- Checkmark -->
    <polyline points="-12,2 -3,11 14,-8" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
